basePath: /
definitions:
  api.InfoResponse:
    properties:
      chainId:
        type: string
      goVersion:
        type: string
      version:
        type: string
    type: object
  apicommon.APIKeyInfo:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      label:
        type: string
      lastUsedAt:
        type: string
      prefix:
        type: string
      revoked:
        type: boolean
      scopes:
        items:
          type: string
        type: array
    type: object
  apicommon.AcceptOrganizationInvitation:
    properties:
      code:
        description: Invitation code
        type: string
      user:
        allOf:
        - $ref: '#/definitions/apicommon.UserInfo'
        description: User information for registration or identification
    type: object
  apicommon.AddCensusParticipantsRequest:
    properties:
      memberIds:
        description: List of existing organization member IDs to add to the census
        items:
          type: string
        type: array
    type: object
  apicommon.AddMembersRequest:
    properties:
      members:
        description: List of members to add
        items:
          $ref: '#/definitions/apicommon.OrgMember'
        type: array
    type: object
  apicommon.AddMembersResponse:
    properties:
      added:
        description: Number of members added
        type: integer
      censusJobIds:
        description: |-
          CensusJobIDs are the async jobs raising the on-chain maxCensusSize of the elections whose
          census just grew, one per organization. Poll each with GET /jobs/{jobId}. Absent when no
          live census was affected.
        items:
          type: string
        type: array
      errors:
        description: |-
          Errors encountered during job. Validation errors are prefixed with
          "line N:", the 1-based position of the offending member in the
          submitted members list.
        items:
          type: string
        type: array
      jobId:
        description: Job ID for tracking the addition process
        example: deadbeef
        format: hex
        type: string
    type: object
  apicommon.CensusSpec:
    properties:
      anonymous:
        description: |-
          Anonymous selects blind-CSP voting: the process publishes with census origin OFF_CHAIN_CA_V2
          and the CSP blind-signs each ballot so it cannot link a signature to the voter. Orthogonal to
          the mail/sms/auth 2FA channel; may be combined with Weighted (V2 binds the weight into the salt).
        type: boolean
      authFields:
        description: |-
          AuthFields are the member fields a voter logs in with. "password" is checked against the
          member's stored password after the other fields find the participant, so it needs at least
          one other auth field or a 2FA field.
        items:
          $ref: '#/definitions/db.OrgMemberAuthField'
        type: array
      groupId:
        description: |-
          GroupID is the org member group the census was built from. Round-trips: it is echoed back on
          process reads, so a client can restore the group a draft targeted. Absent (not a zero id) when
          the census is organization-wide.
        type: string
      memberIds:
        description: |-
          MemberIDs selects the census members explicitly, as an alternative to GroupID. Write-only on
          this type: a process read echoes the census config, not the member list it resolved to.
        items:
          type: string
        type: array
      size:
        description: |-
          Size is the number of members in the census. Response-only (ignored on create/update): for a
          published process it equals the on-chain maxCensusSize of its whole-census questions.
        type: integer
      totalWeight:
        description: |-
          TotalWeight is the whole-census total voting weight (sum of members' weights). Response-only;
          equals Size for a non-weighted census. Needed by clients (e.g. the results report) to turn
          per-answer weights into percentages.
        type: integer
      twoFaFields:
        items:
          $ref: '#/definitions/db.OrgMemberTwoFaField'
        type: array
      weighted:
        type: boolean
    type: object
  apicommon.CreateAPIKeyRequest:
    properties:
      expiresAt:
        description: Optional expiration; when set, the key stops working after this
          time.
        type: string
      label:
        description: Human-readable label to identify the key.
        type: string
      scopes:
        description: Scopes the key is allowed to use (must be a subset of the assignable
          scopes).
        items:
          type: string
        type: array
    type: object
  apicommon.CreateAPIKeyResponse:
    properties:
      createdAt:
        type: string
      createdBy:
        type: string
      expiresAt:
        type: string
      id:
        type: string
      label:
        type: string
      lastUsedAt:
        type: string
      prefix:
        type: string
      revoked:
        type: boolean
      scopes:
        items:
          type: string
        type: array
      secret:
        description: Secret is the full API key, shown only at creation time.
        type: string
    type: object
  apicommon.CreateManagedOrganizationRequest:
    properties:
      address:
        description: The organization's blockchain address
        items:
          type: integer
        type: array
      color:
        description: The organization's brand color in hex format
        type: string
      communications:
        description: Whether the organization has enabled communications
        type: boolean
      counters:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionUsage'
        description: Usage counters for the organization
      country:
        description: The country where the organization is based
        type: string
      createdAt:
        description: Creation timestamp in RFC3339 format
        type: string
      defaultLang:
        description: |-
          Language of the notifications sent on behalf of the organization. It wins on
          authenticated endpoints; on public ones an explicit lang param wins instead.
          Optional on creation, where it defaults to en; empty on update means unchanged
        type: string
      description:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Description is a shorthand for meta["description"]. Same encoding
          rules as Name.
      integrator:
        description: |-
          Whether the new organization is an integrator (opt-in, used by the integrator
          portal): it may create managed organizations and pay for their processes from
          its wallet.
        type: boolean
      logo:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Logo is a shorthand for meta["logo"]. Same encoding rules as
          Name.
      managedBy:
        description: |-
          Integrator organization that manages this org, when it was created through
          the integrator portal. Nil for regular organizations. Lets clients tell
          managed orgs apart from the user's own orgs (e.g. to hide them from the org
          switcher), a distinction Parent does not capture (managed orgs set ManagedBy,
          not Parent).

          A pointer so it is omitted rather than emitted as the zero address: json's
          omitempty does not skip the fixed-size common.Address array.
        example: deadbeef
        format: hex
        type: string
      meta:
        additionalProperties: {}
        description: Arbitrary key value fields with metadata regarding the organization
        type: object
      name:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: |-
          Name is a shorthand for meta["name"]. On write accepts a plain string
          (stored as {"default": "<string>"}) or a locale map; on read it mirrors
          whatever is stored in meta["name"]. If both Name and meta["name"] are
          provided on a create request, meta["name"] takes precedence.
      ownerEmail:
        description: OwnerEmail optionally assigns an existing user as the managed
          org's creator/admin.
        type: string
      parent:
        allOf:
        - $ref: '#/definitions/apicommon.OrganizationInfo'
        description: Parent organization if this is a sub-organization
      size:
        description: The size category of the organization
        type: string
      subdomain:
        description: The organization's subdomain
        type: string
      subscription:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionDetails'
        description: Subscription details for the organization
      timezone:
        description: The organization's timezone
        type: string
      type:
        description: The type of organization
        type: string
      website:
        description: The organization's website URL
        type: string
    type: object
  apicommon.CreateOrganizationMemberGroupRequest:
    properties:
      description:
        description: Description of the group
        type: string
      includeAllMembers:
        description: Include all members of the organization in the group
        type: boolean
      memberIds:
        description: The IDs of the members to add to the group (optional if IncludeAllMembers
          is true)
        items:
          type: string
        type: array
      title:
        description: Title of the group
        type: string
    type: object
  apicommon.CreateOrganizationRequest:
    properties:
      address:
        description: The organization's blockchain address
        items:
          type: integer
        type: array
      color:
        description: The organization's brand color in hex format
        type: string
      communications:
        description: Whether the organization has enabled communications
        type: boolean
      counters:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionUsage'
        description: Usage counters for the organization
      country:
        description: The country where the organization is based
        type: string
      createdAt:
        description: Creation timestamp in RFC3339 format
        type: string
      defaultLang:
        description: |-
          Language of the notifications sent on behalf of the organization. It wins on
          authenticated endpoints; on public ones an explicit lang param wins instead.
          Optional on creation, where it defaults to en; empty on update means unchanged
        type: string
      description:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Description is a shorthand for meta["description"]. Same encoding
          rules as Name.
      integrator:
        description: |-
          Whether the new organization is an integrator (opt-in, used by the integrator
          portal): it may create managed organizations and pay for their processes from
          its wallet.
        type: boolean
      logo:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Logo is a shorthand for meta["logo"]. Same encoding rules as
          Name.
      managedBy:
        description: |-
          Integrator organization that manages this org, when it was created through
          the integrator portal. Nil for regular organizations. Lets clients tell
          managed orgs apart from the user's own orgs (e.g. to hide them from the org
          switcher), a distinction Parent does not capture (managed orgs set ManagedBy,
          not Parent).

          A pointer so it is omitted rather than emitted as the zero address: json's
          omitempty does not skip the fixed-size common.Address array.
        example: deadbeef
        format: hex
        type: string
      meta:
        additionalProperties: {}
        description: Arbitrary key value fields with metadata regarding the organization
        type: object
      name:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: |-
          Name is a shorthand for meta["name"]. On write accepts a plain string
          (stored as {"default": "<string>"}) or a locale map; on read it mirrors
          whatever is stored in meta["name"]. If both Name and meta["name"] are
          provided on a create request, meta["name"] takes precedence.
      parent:
        allOf:
        - $ref: '#/definitions/apicommon.OrganizationInfo'
        description: Parent organization if this is a sub-organization
      provisionAccount:
        description: |-
          Whether to provision the organization's on-chain account at creation
          time (opt-in, eager). Default false preserves the legacy two-step flow
          where the account is created later by the SDK.
        type: boolean
      size:
        description: The size category of the organization
        type: string
      subdomain:
        description: The organization's subdomain
        type: string
      subscription:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionDetails'
        description: Subscription details for the organization
      timezone:
        description: The organization's timezone
        type: string
      type:
        description: The type of organization
        type: string
      website:
        description: The organization's website URL
        type: string
    type: object
  apicommon.CreateOrganizationTicketRequest:
    properties:
      description:
        description: Body of the ticket
        type: string
      title:
        description: Title of the ticket
        type: string
      type:
        description: Type of the ticket to create (definded externally)
        type: string
    type: object
  apicommon.CreateVotingProcessRequest:
    properties:
      addOns:
        allOf:
        - $ref: '#/definitions/db.ProcessAddOns'
        description: |-
          AddOns are the paid per-process options (signed results certificate, custom URL,
          branding). The 2FA add-ons are not here: they derive from census.twoFaFields.
          They change the process price, so editing them invalidates an open checkout session.
      census:
        $ref: '#/definitions/apicommon.CensusSpec'
      description:
        $ref: '#/definitions/db.MultiLangString'
      endDate:
        type: string
      header:
        type: string
      initialStatus:
        description: |-
          InitialStatus is the on-chain status every question's election is published with.
          Empty (default) means READY; "PAUSED" publishes them PAUSED so voting only opens after
          an admin sets each question to READY. Only "" / "READY" / "PAUSED" are accepted (the
          vochain whitelist for NewProcess); anything else is rejected with 400. Persisted on
          the draft and applied at publish time.
        example: PAUSED
        type: string
      orgAddress:
        example: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
        format: hex
        type: string
      questions:
        items:
          $ref: '#/definitions/apicommon.VotingProcessQuestionRequest'
        type: array
      startDate:
        type: string
      streamUri:
        type: string
      title:
        $ref: '#/definitions/db.MultiLangString'
      updatedAt:
        description: |-
          UpdatedAt, on a PUT, is the updatedAt the client last read. The update then applies only if
          the process has not been written since, and is rejected with 409 otherwise, so two clients
          editing the same draft cannot silently overwrite each other. Optional: omitting it keeps the
          unconditional last-writer-wins behaviour. Ignored on POST.
        type: string
    type: object
  apicommon.CreateVotingProcessResponse:
    properties:
      missingData:
        description: MissingData lists the members left out of the census for missing
          the auth data it requires.
        items:
          type: string
        type: array
      processId:
        type: string
    type: object
  apicommon.DeleteManagedOrganizationResponse:
    properties:
      address:
        type: string
    type: object
  apicommon.DeleteMembersRequest:
    properties:
      all:
        description: Delete all members of the organization
        type: boolean
      ids:
        description: List of member internal ids numbers to delete (optional if All
          is true)
        items:
          type: string
        type: array
    type: object
  apicommon.DeleteMembersResponse:
    properties:
      censusJobIds:
        description: |-
          CensusJobIDs are the async jobs raising the on-chain maxCensusSize of the elections whose
          questions the deletion opened to the whole census (pruning an eligibility list to empty is
          "no restriction", not "nobody"). Poll each with GET /jobs/{jobId}. Deleting a member has the
          same on-chain effect through this endpoint as through DELETE /processes/{processId}/census,
          which reports its job — so this reports it too.
        items:
          type: string
        type: array
      count:
        description: Number of members deleted
        type: integer
      errors:
        description: |-
          Errors are resize problems that did not stop the deletion. The members are gone either
          way; what may be missing is the on-chain room for a question the deletion opened to the
          whole census. An empty CensusJobIDs alone cannot report that — a deletion that needed no
          resize looks identical.
        items:
          type: string
        type: array
    type: object
  apicommon.EligibilitySpec:
    properties:
      groupId:
        type: string
      memberIds:
        items:
          type: string
        type: array
    type: object
  apicommon.EnqueuedResponse:
    properties:
      jobId:
        description: Opaque job id; poll GET /jobs/{jobId} for the outcome
        example: a1b2c3
        type: string
    type: object
  apicommon.IntegratorInfoResponse:
    properties:
      canCreateManagedOrg:
        description: 'CanCreateManagedOrg: one more managed organization would be
          allowed now.'
        type: boolean
      enabled:
        type: boolean
      managedOrgsCreated:
        description: ManagedOrgsCreated counts the managed organizations it ever created,
          deleted ones included.
        type: integer
      netTopUpCents:
        description: NetTopUpCents is what its wallet kept from Stripe top-ups (refunds
          and disputes subtract).
        type: integer
      usage:
        $ref: '#/definitions/apicommon.IntegratorUsage'
    type: object
  apicommon.IntegratorUsage:
    properties:
      managedOrgs:
        type: integer
      sentEmails:
        type: integer
      sentSMS:
        type: integer
      sentVotes:
        type: integer
    type: object
  apicommon.JobResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      jobId:
        type: string
      result:
        $ref: '#/definitions/apicommon.UnifiedJobResult'
      status:
        $ref: '#/definitions/db.JobStatus'
      type:
        $ref: '#/definitions/db.JobType'
    type: object
  apicommon.JobsListResponse:
    properties:
      jobs:
        items:
          $ref: '#/definitions/apicommon.JobResponse'
        type: array
      pagination:
        $ref: '#/definitions/apicommon.Pagination'
    type: object
  apicommon.ListAPIKeysResponse:
    properties:
      apiKeys:
        items:
          $ref: '#/definitions/apicommon.APIKeyInfo'
        type: array
    type: object
  apicommon.ListManagedOrganizations:
    properties:
      organizations:
        items:
          $ref: '#/definitions/apicommon.ManagedOrganizationInfo'
        type: array
      pagination:
        $ref: '#/definitions/apicommon.Pagination'
    type: object
  apicommon.ListOrganizationMemberGroupResponse:
    properties:
      members:
        description: List of organization group members
        items:
          $ref: '#/definitions/apicommon.OrgMember'
        type: array
      pagination:
        allOf:
        - $ref: '#/definitions/apicommon.Pagination'
        description: Pagination fields
    type: object
  apicommon.LoginResponse:
    properties:
      expirity:
        description: Token expiration time
        type: string
      token:
        description: JWT authentication token
        type: string
    type: object
  apicommon.ManagedOrganizationInfo:
    properties:
      address:
        description: The organization's blockchain address
        items:
          type: integer
        type: array
      color:
        description: The organization's brand color in hex format
        type: string
      communications:
        description: Whether the organization has enabled communications
        type: boolean
      counters:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionUsage'
        description: Usage counters for the organization
      country:
        description: The country where the organization is based
        type: string
      createdAt:
        description: Creation timestamp in RFC3339 format
        type: string
      defaultLang:
        description: |-
          Language of the notifications sent on behalf of the organization. It wins on
          authenticated endpoints; on public ones an explicit lang param wins instead.
          Optional on creation, where it defaults to en; empty on update means unchanged
        type: string
      description:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Description is a shorthand for meta["description"]. Same encoding
          rules as Name.
      integrator:
        description: |-
          Whether the new organization is an integrator (opt-in, used by the integrator
          portal): it may create managed organizations and pay for their processes from
          its wallet.
        type: boolean
      logo:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: Logo is a shorthand for meta["logo"]. Same encoding rules as
          Name.
      managedBy:
        description: |-
          Integrator organization that manages this org, when it was created through
          the integrator portal. Nil for regular organizations. Lets clients tell
          managed orgs apart from the user's own orgs (e.g. to hide them from the org
          switcher), a distinction Parent does not capture (managed orgs set ManagedBy,
          not Parent).

          A pointer so it is omitted rather than emitted as the zero address: json's
          omitempty does not skip the fixed-size common.Address array.
        example: deadbeef
        format: hex
        type: string
      meta:
        additionalProperties: {}
        description: Arbitrary key value fields with metadata regarding the organization
        type: object
      name:
        allOf:
        - $ref: '#/definitions/apicommon.MultilingualText'
        description: |-
          Name is a shorthand for meta["name"]. On write accepts a plain string
          (stored as {"default": "<string>"}) or a locale map; on read it mirrors
          whatever is stored in meta["name"]. If both Name and meta["name"] are
          provided on a create request, meta["name"] takes precedence.
      parent:
        allOf:
        - $ref: '#/definitions/apicommon.OrganizationInfo'
        description: Parent organization if this is a sub-organization
      size:
        description: The size category of the organization
        type: string
      spendCapCents:
        description: |-
          SpendCapCents is the most the organization's processes may hold debited from the wallet at
          once, in EUR cents; null is unlimited.
        type: integer
        x-nullable: true
      spentCents:
        description: |-
          SpentCents is what its processes hold debited now: refunds and failed-publish credit-backs
          take their amount off again.
        type: integer
      subdomain:
        description: The organization's subdomain
        type: string
      subscription:
        allOf:
        - $ref: '#/definitions/apicommon.SubscriptionDetails'
        description: Subscription details for the organization
      timezone:
        description: The organization's timezone
        type: string
      type:
        description: The type of organization
        type: string
      website:
        description: The organization's website URL
        type: string
    type: object
  apicommon.MultilingualText:
    additionalProperties:
      type: string
    type: object
  apicommon.OAuthLinkRequest:
    properties:
      address:
        description: The address of the user
        type: string
      oauthSignature:
        description: The signature made by the OAuth service on top of the user email
        type: string
      provider:
        description: OAuth provider name (google, github, facebook)
        type: string
      userOAuthSignature:
        description: The signature made by the user on top of the oauth signature
        type: string
    type: object
  apicommon.OAuthLoginRequest:
    properties:
      address:
        description: The address of the user
        type: string
      email:
        description: User email address
        type: string
      firstName:
        description: User first name
        type: string
      lastName:
        description: User last name
        type: string
      oauthSignature:
        description: The signature made by the OAuth service on top of the user email
        type: string
      provider:
        description: OAuth provider name (google, github, facebook)
        type: string
      userOAuthSignature:
        description: The signature made by the user on on top of the oauth signature
        type: string
    type: object
  apicommon.OAuthLoginResponse:
    properties:
      expirity:
        description: Token expiration time
        type: string
      registered:
        description: Whether the user had to be  registered
        type: boolean
      token:
        description: JWT authentication token
        type: string
    type: object
  apicommon.OrgMember:
    properties:
      birthDate:
        description: Member's date of birth in format YYYY-MM-DD
        type: string
      email:
        description: Member's email address
        type: string
      hasPassword:
        description: 'HasPassword is true on reads when the member has a password.
          Read-only: ignored on writes.'
        type: boolean
      id:
        description: Member's internal unique internal ID
        type: string
      memberNumber:
        description: Unique member number as defined by the organization
        type: string
      name:
        description: Member's name
        type: string
      nationalId:
        description: Member's National ID No
        type: string
      other:
        additionalProperties: {}
        description: Additional custom fields
        type: object
      password:
        description: |-
          Member's password, write-only: the client hash of the plaintext, 64 lowercase hex characters,
          lowercase_hex(SHA-256(UTF-8("vocdoni-member-password:" + org address as 0x + 40 lowercase hex +
          ":" + trim(password).normalize("NFC")))). Stored as an argon2 hash salted per member (with the
          member id) and never returned: reads report hasPassword.
        type: string
      phone:
        description: Member's phone number
        type: string
      surname:
        description: Member's surname
        type: string
      weight:
        description: Member's census weight
        type: string
    type: object
  apicommon.OrganizationAddMetaRequest:
    properties:
      meta:
        additionalProperties: {}
        description: Set of key-value pairs to add or update in the organization's
          meta information
        type: object
    type: object
  apicommon.OrganizationAddresses:
    properties:
      addresses:
        description: List of organization blockchain addresses
        items:
          items:
            type: integer
          type: array
        type: array
    type: object
  apicommon.OrganizationCensus:
    properties:
      authFields:
        description: Optional for defining which member data should be used for authentication
        items:
          $ref: '#/definitions/db.OrgMemberAuthField'
        type: array
      censusId:
        description: Unique identifier for the census
        type: string
      groupID:
        description: Optional for creating a census based on an organization member
          group
        type: string
      orgAddress:
        description: Organization address
        items:
          type: integer
        type: array
      size:
        description: Size of the census
        type: integer
      twoFaFields:
        description: Optional for defining which member data should be used for two-factor
          authentication
        items:
          $ref: '#/definitions/db.OrgMemberTwoFaField'
        type: array
      type:
        allOf:
        - $ref: '#/definitions/db.CensusType'
        description: Type of census
      weighted:
        description: Weighted indicates if the census uses weighted voting
        type: boolean
    type: object
  apicommon.OrganizationCensuses:
    properties:
      censuses:
        description: List of organization censuses
        items:
          $ref: '#/definitions/apicommon.OrganizationCensus'
        type: array
    type: object
