  /pricing:
    get:
      description: |-
        Public calculator over the published pricing formula: pass the inputs, get the
        same breakdown GET /processes/{processId}/price returns for a draft. EUR cents,
        VAT excluded (Stripe Tax adds VAT at checkout). No organization context: branding
        is charged as requested and legacy plan credits are not applied. Base price on
        graduated bands, free up to 25 voters; add-ons are charged on free processes too.
        A priced total below €1 is raised to €1 by a minimumCharge line. Above 15 000
        voters a custom quote is recommended (quoteRecommended). Above 50 000 the process
        is quote-only: quoteRequired is true and there is no price (empty lines,
        totalCents 0 — not free).
      parameters:
      - description: Eligible voters (census size), at least 1
        in: query
        name: voters
        required: true
        type: integer
      - description: Email 2FA add-on (free for standard organizations)
        in: query
