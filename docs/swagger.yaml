        type: string
      removeMembers:
        description: The IDs of the members to remove from the group
        items:
          type: string
        type: array
      title:
        description: Updated Title
        type: string
    type: object
  apicommon.UpdateOrganizationUserRoleRequest:
    properties:
      role:
        description: The new role to assign to the user
        type: string
    type: object
  apicommon.UpdateProcessCensusResponse:
    properties:
      added:
        type: integer
      errors:
        items:
          type: string
        type: array
      jobId:
        type: string
      removed:
        description: |-
          Removed is how many census participants the DELETE actually removed — an id naming nobody
          does not count. Always present, like Added, so "none removed" is not indistinguishable from
          a field the PUT simply never sets.
        type: integer
    type: object
  apicommon.UpdateQuestionCensusRequest:
    properties:
      memberIds:
        description: |-
          MemberIDs is the complete desired eligibility list, not a delta, so the request is
          idempotent: resend the whole list to change it.

          An empty list is not "nobody" — it is the encoding for "no restriction", which opens the
          question to every member of the process census.
        items:
          type: string
        type: array
    type: object
  apicommon.UpdateQuestionCensusResponse:
    properties:
      added:
        type: integer
      eligible:
        description: Eligible is the size of the stored list. Zero means the question
          is open to the whole census.
        type: integer
      jobId:
        description: |-
          JobID is the async job raising the election's on-chain maxCensusSize, present only when the
          question needed more room than it was published with (202).
