      description: |-
        Create or update an organization member. Requires Manager/Admin role.
        Automatically updates census participant hashes when member data changes.

        On an update, a field left out of the body keeps its stored value and a field sent as an
        empty string is cleared. Phone and password are never returned in plaintext: leave them out
        to keep them.

        Also callable with a scoped API key (scope: `members:write`).

        402 when the change would grow a published process's census beyond what it paid for:
        40178 with the quote in data (its processId names the process to buy headroom for with
        POST /processes/{processId}/census/checkout); for a managed organization, 40175 when its
        integrator's wallet falls short (data: requiredCents, availableCents), or 40183 past the
        spend cap its integrator set (data: capCents, spentCents, requiredCents).
        422 when the grown census needs a custom quote.
        409 (40903) while a process built on a census the change grows holds its publish claim:
        nothing is written (except for an edit turned into a creation, below); retry once the claim is
        released: when its publish job ends, or up to 15 minutes after a service restart
        (PublishStaleAfter), as for POST /processes/{processId}/publish. A checkout, a checkout cancel
