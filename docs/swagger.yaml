      spendCapCents:
        description: |-
          SpendCapCents caps what the organization's processes may hold debited from the
          integrator's wallet, in EUR cents; null lifts the cap. Required: a body without it (or
          with any other key) is refused.
        type: integer
        x-nullable: true
    type: object
  apicommon.UpdateOrganizationMemberGroupResponse:
    properties:
      censusJobIds:
        description: |-
          CensusJobIDs are the async jobs raising the on-chain maxCensusSize of the elections whose
          census just grew or reopened. Poll each with GET /jobs/{jobId}.
        items:
          type: string
        type: array
      errors:
        description: Errors are per-census problems that did not stop the group update.
        items:
          type: string
        type: array
    type: object
  apicommon.UpdateOrganizationMemberGroupsRequest:
    properties:
      addMembers:
        description: The IDs of the members to add to the group
        items:
          type: string
        type: array
      description:
