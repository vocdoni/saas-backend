        type: boolean
      - description: SMS 2FA add-on (€0.05 per voter)
        in: query
        name: smsTwoFA
        type: boolean
      - description: Signed results certificate add-on (€39)
        in: query
        name: signedCertificate
        type: boolean
      - description: Custom URL add-on (€99, once per organization)
        in: query
        name: customUrl
        type: boolean
      - description: Branding / white label add-on (€149, once per organization)
        in: query
        name: branding
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessPriceResponse'
        "400":
