  /processes/census/validation:
    post:
      consumes:
      - application/json
      description: |-
        Pre-flight check of a /processes census spec: verifies the chosen auth/2FA fields
        produce unique, complete credentials over the target members — a group (groupId), an
        explicit memberIds subset, or the whole organization when neither is set. Returns 400
        with the offending member ids (duplicates / missingData) when the census is not usable,
        otherwise 200. A field that is empty or only whitespace counts as missing data, and
        members with missing data are never reported as duplicates. The `password` auth field
        never identifies a member on its own: a census with no other auth field and no 2FA field
        is a 400. Requires Manager/Admin role of the organization. While the service has anonymous
        voting temporarily off, an `anonymous: true` spec is a 400 (40037) "anonymous voting is
        temporarily unavailable".

        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Org address + census spec
        in: body
        name: request
        required: true
