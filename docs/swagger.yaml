          $ref: '#/definitions/handlers.ProcessQuestionStatus'
        type: array
      weight:
        example: 2a
        format: hex
        type: string
    type: object
  handlers.ProcessQuestionStatus:
    properties:
      canVote:
        type: boolean
      hasSigned:
        type: boolean
      hasVoted:
        type: boolean
      questionId:
        type: string
      upstreamId:
        example: deadbeef
        format: hex
        type: string
    type: object
  handlers.ProcessSignInfoResponse:
    properties:
      consumed:
        items:
          $ref: '#/definitions/handlers.QuestionConsumedAddress'
        type: array
    type: object
  handlers.QuestionConsumedAddress:
    properties:
      address:
        description: |-
          Address and Nullifier are omitted for a blind (anonymous) census: the CSP never learns the
          voter address, so it reports neither — the voter derives its own nullifier from its address.
        example: deadbeef
        format: hex
        type: string
      at:
        type: string
      nullifier:
        example: deadbeef
        format: hex
        type: string
      questionId:
        type: string
      upstreamId:
        example: deadbeef
        format: hex
        type: string
    type: object
  handlers.SignBatchBallot:
    properties:
      address:
        example: deadbeef
        format: hex
        type: string
      upstreamId:
        example: deadbeef
        format: hex
        type: string
    type: object
  handlers.SignBatchRequest:
    properties:
      authToken:
        example: deadbeef
        format: hex
        type: string
      ballots:
        items:
          $ref: '#/definitions/handlers.SignBatchBallot'
        type: array
    type: object
  handlers.SignBatchResponse:
    properties:
      signatures:
        items:
          $ref: '#/definitions/handlers.SignBatchResult'
        type: array
    type: object
  handlers.SignBatchResult:
    properties:
      code:
        type: string
      error:
        type: string
      signature:
        example: deadbeef
        format: hex
        type: string
      upstreamId:
        example: deadbeef
        format: hex
        type: string
      weight:
        example: 2a
        format: hex
        type: string
    type: object
  handlers.SignRequest:
    properties:
      authToken:
        example: deadbeef
        format: hex
        type: string
      electionId:
        example: deadbeef
        format: hex
        type: string
      payload:
        type: string
      tokenR:
        example: deadbeef
        format: hex
        type: string
    type: object
  handlers.UserWeightRequest:
    properties:
      authToken:
        example: deadbeef
        format: hex
        type: string
    type: object
  handlers.UserWeightResponse:
    properties:
      weight:
        example: 2a
        format: hex
        type: string
    type: object
  pricing.QuoteLine:
    properties:
      amountCents:
        type: integer
      description:
        type: string
      kind:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: info@vocdoni.io
    name: API Support
    url: https://vocdoni.io
  description: API for Vocdoni SaaS Backend
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Vocdoni SaaS API
  version: "1.0"
paths:
  /auth/addresses:
    get:
      consumes:
      - application/json
      description: Get the list of organization addresses the user belongs to
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.OrganizationAddresses'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: No organizations found
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Get a list of addresses the user belongs to
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and get a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.UserInfo'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Server busy, retry after the Retry-After delay
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Login to get a JWT token
      tags:
      - auth
  /auth/oauth:
    post:
      consumes:
      - application/json
      description: Link an OAuth provider to an existing authenticated account
      parameters:
      - description: OAuth link information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.OAuthLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Invalid provider or provider already linked
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized or signature verification failed
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Server busy, retry after the Retry-After delay
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Link OAuth provider to account
      tags:
      - auth
  /auth/oauth/{provider}:
    delete:
      consumes:
      - application/json
      description: Unlink an OAuth provider from an authenticated account. Cannot
        unlink the last authentication method.
      parameters:
      - description: OAuth provider name (google, github, facebook)
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Invalid provider, provider not linked, or cannot unlink last
            auth method
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Unlink OAuth provider from account
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the JWT token for an authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Refresh JWT token
      tags:
      - auth
  /info:
    get:
      description: Returns the service version, build information and the Vocdoni
        chain ID.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.InfoResponse'
      summary: Get service information
      tags:
      - health
  /integrator:
    get:
      description: |-
        Returns whether the caller's organization (resolved from the API key's org or the user
        session — no address in the URL) is enabled as an integrator, along with the usage summed
        across its managed organizations. The caller must be an admin or manager of the
        organization. Its spending is bounded by its wallet balance
        (GET /organizations/{orgAddress}/wallet). Until its wallet keeps a top-up
        (`netTopUpCents` > 0) it creates one managed organization, deleted ones included, and the
        next creation answers 402 (40184); then there is no limit. `managedOrgsCreated` counts the
        creations and `canCreateManagedOrg` says whether one more is allowed now. An integrator
        migrated with managed organizations counts at least those, so it tops up before adding
        another. When the organization is not an integrator, `enabled` is false.

        Also callable with a scoped API key (scope: `quota:read`).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.IntegratorInfoResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Get integrator status and usage
      tags:
      - integrator
  /integrator/organizations:
    get:
      description: |-
        Returns a paginated list of organizations managed by the caller's integrator
        organization (resolved from the API key's org or the user session — no address in the
        URL). The caller must be an admin or manager of the integrator organization. Each item
        carries its spend cap (`spendCapCents`, null when unlimited) and what its processes hold
        debited from the integrator wallet (`spentCents`).

        Also callable with a scoped API key (scope: `managed:read`).
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Number of items per page (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ListManagedOrganizations'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: List organizations managed by an integrator
      tags:
      - integrator
    post:
      consumes:
      - application/json
      description: |-
        Create a new organization managed by the caller's integrator organization. The
        integrator is resolved from the authenticated principal (the API key's org, or the
        user's organization for a session) — no address is passed in the URL. The caller must
        be an admin of that integrator organization, which must be enabled as an integrator.
        Until the integrator has topped up its wallet (top-ups less Stripe refunds and disputes
        above zero) it may manage one organization: the next is refused with 402 (40184, data:
        managedOrgs, managedOrgsCreated, netTopUpCents). Once it has, there is no limit on how many it manages,
        whatever its current balance. The managed org's on-chain account is always
        provisioned eagerly. The optional `ownerEmail` designates the managed org's owner/admin
        (defaults to the calling user); the per-user MaxOrgsPerUser cap is bypassed for managed orgs.

        Also callable with a scoped API key (scope: `managed:write`).
      parameters:
      - description: Managed organization information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.CreateManagedOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.OrganizationInfo'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "402":
          description: Top up the integrator wallet to create another managed organization
            (40184)
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Not an integrator
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Integrator organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Create a managed organization under an integrator
      tags:
      - integrator
  /integrator/organizations/{orgAddress}:
    delete:
      description: |-
        Delete the managed organization at {orgAddress} together with every piece of data
        tied to it (memberbase, censuses + participants, processes and their questions,
        bundles, CSP tokens, jobs, pending invites), and unlink it from its members. Drafts
        are deleted first, exactly as DELETE /processes/{processId} does: a paid draft is
        credited back to the payer's wallet before it goes, and its payment record goes with
        it (the credit-back row in the payer's wallet history is the audit trail). Every
        once-per-organization add-on price (branding, custom URL) an earlier credit-back
        withheld that no published or mined process of the organization received is
        credited back too, once. If any draft cannot be deleted (a publish holds it, or its
        credit-back failed), the deletion stops with that draft's error (its message names the draft) and nothing else is
        removed; retry once it settles. The caller must be an admin
        of their integrator organization (resolved from the API key's org or the user session
        — no address in the URL), and the target must be managed by it.

        Deletion is blocked with 409 when any of the managed org's published elections is
        still active on-chain (READY/PAUSED); end them (or wait for them to end) first.
        The on-chain organization account and any published elections/censuses are immutable
        on the Vochain and are not affected — only DB-side data is removed.

        Also callable with a scoped API key (scope: `managed:write`).
      parameters:
      - description: Managed organization address to delete
        in: path
        name: orgAddress
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.DeleteManagedOrganizationResponse'
        "400":
          description: Invalid address
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Managed organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Managed organization has active elections, or a draft cannot
            be deleted yet
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Delete a managed organization and all its data
      tags:
      - integrator
    put:
      consumes:
      - application/json
      description: |-
        Caps what the managed organization at {orgAddress} may spend from the caller's integrator
        wallet: the most its processes may hold debited at once, in EUR cents (VAT excluded).
        The body must hold exactly `spendCapCents`: `null` lifts the cap, and a missing key or
        any other key is a 400, so a typo never lifts it. Organizations start unlimited.
        The cap is checked in the same write as the wallet balance, so a publish or census
        top-up that would pass it is refused with 402
        (40183, data: capCents, spentCents, requiredCents) without charging anything. Refunds of
        deleted drafts and credit-backs of failed publishes free their amount again. A cap below
        what is already spent only refuses further debits. The caller must be an admin of their
        integrator organization, and the target must be managed by it.

        Also callable with a scoped API key (scope: `managed:write`).
      parameters:
      - description: Managed organization address
        in: path
        name: orgAddress
        required: true
        type: string
      - description: Spend cap
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.UpdateManagedOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ManagedOrganizationInfo'
        "400":
          description: Invalid address, negative cap, or a body without exactly spendCapCents
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Not an integrator
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Managed organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Set a managed organization's spend cap
      tags:
      - integrator
  /integrator/organizations/{orgAddress}/apikeys:
    get:
      description: |-
        Returns the metadata of all API keys owned by the organization (never the secret).
        The caller must be an admin of the organization.
      parameters:
      - description: Organization address
        in: path
        name: orgAddress
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ListAPIKeysResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: List an organization's API keys
      tags:
      - integrator
    post:
      consumes:
      - application/json
      description: |-
        Create a new API key owned by the organization at the given address. The caller
        must be an admin of the organization, which must be enabled as an integrator —
        API keys are integrator-only. The plaintext secret (prefixed "vsk_") is
        returned ONCE in the response and cannot be retrieved again.

        `label` and at least one `scope` are required. Valid scopes are deny-by-default and
        must be a subset of: `quota:read`, `managed:read`, `managed:write`, `voting:write`,
        `members:write`. The optional `expiresAt`, when set, must be in the future.
      parameters:
      - description: Organization address
        in: path
        name: orgAddress
        required: true
        type: string
      - description: API key information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.CreateAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created key including the one-time plaintext secret
          schema:
            $ref: '#/definitions/apicommon.CreateAPIKeyResponse'
        "400":
          description: Invalid input (bad address, missing label/scopes, unknown scope,
            past expiresAt)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Organization is not an integrator
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Create an API key for an organization
      tags:
      - integrator
  /integrator/organizations/{orgAddress}/apikeys/{keyId}:
    delete:
      description: |-
        Revokes (permanently disables) the API key with the given ID. The caller must be
        an admin of the organization.
      parameters:
      - description: Organization address
        in: path
        name: orgAddress
        required: true
        type: string
      - description: API key ID
        in: path
        name: keyId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Invalid input data (missing key ID)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: API key not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Revoke an organization's API key
      tags:
      - integrator
  /jobs:
    get:
      description: |-
        Paginated list of an organization's async jobs — member/census imports and tx jobs
        (publish, status change, census update, vote relay) — newest first. Requires
        Manager/Admin role of the organization given by the `orgAddress` query parameter. Each
        job carries a unified `result` that only includes the attributes its type produced.
      parameters:
      - description: Organization address
        in: query
        name: orgAddress
        required: true
        type: string
      - description: Filter by job type (e.g. org_members, census_participants, relay_vote)
        in: query
        name: type
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 10)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.JobsListResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: List an organization's jobs
      tags:
      - jobs
  /jobs/{jobId}:
    get:
      description: |-
        Returns the current state of an async job (member/census import or a tx job: publish,
        status change, census update, vote relay), in the same unified shape as GET /jobs.
        Always responds 200; `status` carries the lifecycle state (`pending`, `completed`,
        `failed`) and `result` carries only the attributes the job produced (import counters
        `added`/`total`/`progress`, or tx `address`/`voteID`/`status`), each omitted when empty.
        Public endpoint: the 32-byte job id is the capability and results carry only public
        data. Per-row import error detail (which may reference member data) is returned only
        to an authenticated manager/admin of the job's organization (as on GET /jobs);
        anonymous callers get status and counters only.
      parameters:
      - description: Job id returned by the async endpoint (hex)
        in: path
        name: jobId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Unified job status and result
          schema:
            $ref: '#/definitions/apicommon.JobResponse'
        "400":
          description: Invalid job id
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Job not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Poll the status of an async job
      tags:
      - jobs
  /oauth/login:
    post:
      consumes:
      - application/json
      description: Register or authenticate a user (OAuth or email/password) and return
        a JWT token
      parameters:
      - description: Login credentials; see description for details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.OAuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.OAuthLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Server busy, retry after the Retry-After delay
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Login using OAuth service or classic credentials
      tags:
      - auth
  /organizations:
    post:
      consumes:
      - application/json
      description: |-
        Create a new organization. If the organization is a suborganization, the parent organization must be
        specified in the request body, and the user must be an admin of the parent. If the parent organization
        is already a suborganization, an error is returned.

        Two optional opt-in fields support the chain-abstracted flow (both default false, preserving the legacy
        behavior): `provisionAccount` forges the organization's on-chain account eagerly at creation time
        (idempotent) instead of leaving it to the legacy SDK createAccount path; `integrator` flags the
        new organization as an integrator, so it may create managed organizations.
      parameters:
