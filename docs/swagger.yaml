  /organizations/{orgAddress}/wallet:
    get:
      description: |-
        Prepaid EUR balance (1 credit = €1, VAT excluded) and paged history, newest first,
        of an organization's wallet — a standard organization's or an integrator's. History
        kinds: topup (Stripe checkout credit), payment (a process publish or census
        headroom; processOrgAddress names the managed organization that spent it),
        creditBack (a paid draft deleted, a publish that failed for good, or an organization
        teardown returning an add-on price no process received) and refund (a
        top-up refunded through Stripe). amountCents is signed. The balance is negative only
        after a refund of credit already spent; the next top-up pays that first. 403 (40181)
        for a managed organization, which has no wallet. Requires Admin or Manager.

        Also callable with a scoped API key (scope: `quota:read`) of this same organization.
      parameters:
      - description: Organization address
        in: path
        name: orgAddress
        required: true
        type: string
      - description: Page number, starting at 1
        in: query
        name: page
        type: string
      - description: Items per page
        in: query
        name: limit
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.WalletResponse'
        "400":
          description: Invalid page or limit
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Managed organization, or an API key of another organization
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Get an organization's wallet
      tags:
      - organizations
  /organizations/{orgAddress}/wallet/topup:
    post:
      consumes:
      - application/json
      description: |-
        Opens a one-time Stripe checkout session that credits the organization's wallet once
        the payment is verified by webhook — never before. The amount is EUR cents, VAT
        excluded (Stripe Tax adds VAT at checkout), between €1 and €100 000. 403 (40181) for
        a managed organization. Requires an Admin user session; not callable with an API key.
        GET /subscriptions/checkout/{sessionId} reports the session's Stripe state; the money
        is in once GET /organizations/{orgAddress}/wallet shows the `topup` row: poll that. A
        delayed payment (SEPA) shows nothing until it is paid; one that fails or expires never
        shows a row, and a new top-up is needed.
      parameters:
      - description: Organization address
        in: path
        name: orgAddress
        required: true
        type: string
      - description: Top-up parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.WalletTopUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessCheckoutResponse'
        "400":
          description: Amount out of bounds
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Managed organization
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Top up an organization's wallet
      tags:
      - organizations
