          schema:
            $ref: '#/definitions/errors.Error'
      summary: Compute a pay-per-process price
      tags:
      - processes
  /processes:
    get:
      description: |-
        Paginated list of an organization's voting processes. Public: anonymous callers get
        published processes only (without per-question eligibleMemberIds). A Manager/Admin of
        the org (or a voting:write API key acting as one) also gets drafts and the eligibility.
        Filter by question status, and by published state.
        published=true returns published processes only; published=false returns drafts only and
        requires Manager/Admin (401 otherwise). Omitting it keeps the caller's default view.
        Combining published=false with status returns nothing: a draft's questions have no
        on-chain status yet, and status matches on that field.
      parameters:
      - description: Organization address
        in: query
        name: orgAddress
        required: true
        type: string
      - description: Filter by question status
        in: query
        name: status
        type: string
      - description: Filter by published state; false (drafts) requires Manager/Admin
        in: query
        name: published
        type: boolean
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.VotingProcessListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
      summary: List voting processes
      tags:
      - processes
    post:
      consumes:
      - application/json
      description: |-
        Create a multi-question voting process draft. Requires Manager/Admin role of the org
        (or a scoped API key with `voting:write`). Creates the inline census unpublished.
        Census members missing required auth data (an empty auth field, or no 2FA channel) could
        never log in: they are left out of the census and listed in the response `missingData`.
        Members the census cannot tell apart (data equal but for case, or equal to a participant
        already in the census) are refused with a 400 (40037) whose `data.duplicates` lists them.

        Each question must define a named `type` — `singlechoice`, `multichoice`, `ranked`
        or `cumulative` — a raw `ballotProtocol`, or both. `multichoice` and `cumulative`
        need a `typeSetup` (maxChoices for the former, budget and costExponent for the
        latter); `singlechoice` and `ranked` derive their whole protocol from the choices.
        The two are kept in sync: whichever is supplied, the other is derived, so the
        stored question always describes the election it will mint. A supplied
        `ballotProtocol` is authoritative — it is what reaches the chain — so `type`
        and `typeSetup` are re-derived from it, and come back empty only when it encodes a
        shape with no named type at all (vote overwrites, weighted cost, or a hand-crafted
        non-canonical shape). Sending both halves is fine when they agree; when they
        describe two different named ballots it is a 400 rather than a silent win
        for the protocol. **Omit `ballotProtocol` to author or edit a question through its
        `typeSetup`** — responses always carry a protocol, so echoing one back unchanged
        re-applies it.

        While the service has anonymous voting temporarily off, a census with `anonymous: true` is
        a 400 (40037) "anonymous voting is temporarily unavailable".

        `typeSetup.minChoices` has no on-chain counterpart and is a validation hint for
        clients. It is stored as sent for multichoice, and is always `1` for singlechoice,
        whose ballot is the single field a voter fills.

        `typeSetup.uniqueChoices` is rejected for multichoice: every choice is an independent
        yes/no field, so a unique-values ballot admits no vote and the election would tally
        every vote to zero. A `ballotProtocol` whose `uniqueValues` cannot be satisfied
        (fewer legal values than fields) is rejected for the same reason.
      parameters:
      - description: Voting process
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.CreateVotingProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.CreateVotingProcessResponse'
        "400":
          description: Invalid input data, or anonymous voting temporarily unavailable
            (40037)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: The organization is being deleted (40901)
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Create a voting process draft
      tags:
      - processes
  /processes/{processId}:
    delete:
      description: |-
        Delete an unpublished voting process draft together with its inline census. A
        published process has on-chain elections and cannot be deleted. Requires
        Manager/Admin role of the organization that owns the process.

        A paid draft is credited back to the wallet that paid it before it is deleted (the
        organization's own, or its integrator's for a managed organization); nothing is ever
        refunded to a card. The payment record goes with the draft: the credit-back row in the
        wallet history (GET /organizations/{orgAddress}/wallet) is the audit trail. The
        once-per-organization add-ons it paid (branding, custom URL) are released so the
        organization's next process can buy them — except one another process relies on,
        which is withheld from the credit and stays the organization's. An open top-up
        checkout of the draft is expired first; one already completed still credits the
        wallet when its webhook arrives.

        409 (40903) also answers while an election a failed publish submitted is not settled on
        chain yet (it may still be mined): publish the draft again (it adopts or resubmits at no
        new charge) or retry later. One that was mined is adopted, and the draft then answers 409
        (40904) like any partially published one.

        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Already published, partially published (40904), being published,
            or payment changed
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Delete a voting process draft
      tags:
      - processes
    get:
      description: |-
        Read a voting process with its hydrated questions (live per-question results included).
        Public for published processes; a draft is visible only to a Manager/Admin of the org
        (or a voting:write API key acting as one) and returns 404 otherwise. Non-managers never
        receive the per-question eligibleMemberIds. A Manager/Admin caller additionally receives
        each open-value question's free-text voter memos inside its results.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.VotingProcessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Get a voting process
      tags:
      - processes
    put:
      consumes:
      - application/json
      description: |-
        Update a voting process while it is still a draft (not published). 409 if already published,
        and 409 (40904) if partially published — an earlier publish already mined some of its
        questions on-chain, so the draft can only be published again (resuming the rest), not edited.
        409 (40177) when the edit turns a once-per-organization add-on on for a draft that was paid
        without it, since an add-on cannot be added after payment.
        409 (40903) while a publish is running, or while an election a failed publish submitted is
        not settled on chain yet (it may still be mined): publish the draft again (it adopts or
        resubmits at no new charge) or retry later. One that was mined is adopted first, and the
        edit then answers 409 (40904).
        The questions are replaced wholesale, and each one's ballot shape is reconciled exactly
        as on create. Reading a question and PUTting it back unchanged is a no-op; editing its
        `typeSetup` while echoing the `ballotProtocol` that still encodes the old shape is a
        400 — omit `ballotProtocol` to edit a question through its `typeSetup`.

        Send the updatedAt read from GET /processes/{processId} to make the update conditional: it is
        rejected with 409 (40171) if anything wrote the process in between, so two editors cannot
        overwrite each other. Omitting updatedAt opts out of that guarantee and keeps last-writer-wins.

        Census members are handled as on create: those missing required auth data are left out
        and listed in `missingData`, and those the census cannot tell apart are a 400 (40037)
        whose `data.duplicates` lists them. While the service has anonymous voting temporarily off,
        a census with `anonymous: true` is a 400 (40037) "anonymous voting is temporarily unavailable".
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Voting process
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.CreateVotingProcessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.CreateVotingProcessResponse'
        "400":
          description: Invalid input data, or anonymous voting temporarily unavailable
            (40037)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Update a voting process draft
      tags:
      - processes
  /processes/{processId}/auth/{step}:
    post:
      consumes:
      - application/json
      description: |-
        Two-step voter authentication for a multi-question voting process (the /processes
        replacement of the bundle auth flow); the issued token is anchored to the process.
        - Step 0: handlers.AuthRequest — member identification fields (name, surname,
        memberNumber, nationalId, birthDate, email, phone, password); which are required depends
        on the census auth configuration. If valid, a challenge is sent and a token returned.
        `password` is the member password's client hash (64 lowercase hex characters, see
        handlers.AuthRequest); a wrong one answers exactly like an unknown participant (40802)
        and spends the same failed-attempt budget. When the server's password-hashing capacity
        is exhausted, it answers 503, code 50302: retry later (this spends no budget).
        - Step 1: handlers.AuthChallengeRequest — { authToken, authData: [challenge solution] }.
        If valid the token is marked verified and returned. Auth-only censuses may not require
        a challenge solution.
        Step 0 returns the same error (40802) whether the login data matches no census participant
        or the contact data does not match an existing one. Failed attempts are capped per UTC hour
        on the process for each submitted set of login and contact fields, and, ten times higher,
        for each set of login fields across all contacts tried. Once either is exhausted, step 0
        answers 40017 until the hour ends (the voter cap even with the right contact data);
        data.retryAfter gives the seconds left.
        A member's challenge sends (new tokens + resends) are capped per UTC day, also answering
        40017 with data.retryAfter.
        Step 0 for an anonymous census is refused (400, 40037, "anonymous voting is temporarily
        unavailable") while the service has anonymous voting off.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Authentication step (0 or 1)
        in: path
        name: step
        required: true
        type: string
      - description: Step 0 body; step 1 uses AuthChallengeRequest (see description)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid input data, attempt or send limit (40017), or anonymous
            voting unavailable
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Invalid authentication data, cooldown not reached, or invalid
            challenge
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process, census, or organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Password- or phone-hashing capacity exhausted, retry later
            (50302)
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Authenticate a voter for a voting process
      tags:
      - processes
  /processes/{processId}/auth/resend:
    post:
      consumes:
      - application/json
      description: |-
        Resend the challenge for an existing (non-verified) authentication token of a voting
        process. The request must include the auth token and a valid contact method for the
        census type (email/phone). The same token is returned if the challenge is queued.
        A token can be resent at most 3 times, and a contact that does not match the member spends
        one of them too. For an anonymous census it is refused (400, 40037, "anonymous voting is
        temporarily unavailable") while the service has anonymous voting off.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Resend request with auth token and contact data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.AuthResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Malformed body, missing token, invalid contact, verified token,
            or resend limit (40017)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Invalid/expired token, token not belonging to the process,
            or contact mismatch
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Census or organization not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Phone-hashing capacity exhausted, retry later (50302)
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Resend a voting process auth challenge
      tags:
      - processes
  /processes/{processId}/blind-point:
    post:
      consumes:
      - application/json
      description: |-
        Round 1 of the two-round blind CSP signing flow, for a process whose census is
        anonymous (OFF_CHAIN_CA_V2). For each requested on-chain election id the CSP returns a
        fresh blind point R (tokenR) the client uses to blind its CA bundle before calling
        blind-sign, plus the CSP-authorized weight the client must carry in that bundle. The
        batch is authorized as a unit (each election must belong to the process and the member
        be eligible, else 401); per-election issuance failures are reported inline with a code.
        Public endpoint: the verified auth token authenticates the voter. Rejected (400) for a
        non-anonymous process — use the sign endpoints there. Refused (400, "anonymous voting is
        temporarily unavailable") while the service has anonymous voting off.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Auth token and one election id per question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BlindPointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BlindPointResponse'
        "400":
          description: Invalid input data, non-anonymous process, or anonymous voting
            temporarily unavailable
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized, unverified token, election not in process, or
            member not eligible
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Issue blind points for a blind (anonymous) voting process (round 1)
      tags:
      - processes
  /processes/{processId}/blind-sign:
    post:
      consumes:
      - application/json
      description: |-
        Round 2 of the two-round blind CSP signing flow. For each election the client sends
        the CA-bundle hash already blinded with the round-1 blind point; the CSP blind-signs it
        without ever seeing the voter address, which is what keeps the ballot unlinkable. The
        batch is authorized as a unit (same rules as sign-batch) and then each ballot is signed,
        consuming that election's slot; the response is always 200 with one entry per item, in
        order, carrying the raw blind-signature scalar or a stable code (blind_request_missing if
        no round-1 point was issued; the other signing codes as usual). Public endpoint. Rejected
        (400) for a non-anonymous process — use the sign endpoints there. Refused (400, "anonymous
        voting is temporarily unavailable") while the service has anonymous voting off.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Auth token and one blinded ballot per question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.BlindSignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BlindSignResponse'
        "400":
          description: Invalid input data, non-anonymous process, or anonymous voting
            temporarily unavailable
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized, unverified token, election not in process, or
            member not eligible
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Blind-sign every ballot of a blind (anonymous) voting process (round
        2)
      tags:
      - processes
  /processes/{processId}/census:
    delete:
      consumes:
      - application/json
      description: |-
        Remove members from a published voting process's census and from every question
        eligibility list built on it, so the CSP stops signing for them. Refused with 409 for
        any member the CSP has already signed for while a question of the process is still
        READY or PAUSED; once voting closes on those questions the removal succeeds. The
        offending ids come back in `data.signedMemberIds`. Members no longer in the census are
        removed as a no-op rather than refused.

        Pruning a question's eligibility list to empty opens it to the whole census, so a
        maxCensusSize increase may be enqueued as an async job (poll GET /jobs/{jobId}).
        Requires Manager/Admin role.

        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Member IDs to remove
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.AddCensusParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Members removed
          schema:
            $ref: '#/definitions/apicommon.UpdateProcessCensusResponse'
        "202":
          description: Members removed; maxCensusSize update enqueued
          schema:
            $ref: '#/definitions/apicommon.UpdateProcessCensusResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Process is not published, or a member has already been signed
            for
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Remove members from a published process census
      tags:
      - processes
    put:
      consumes:
      - application/json
      description: |-
        Add existing organization members to the census of an already-published voting process
        and raise each affected on-chain election's maxCensusSize so the new members can vote. Members are
        added synchronously; the maxCensusSize update runs as an async job (poll GET /jobs/{jobId}).
        Questions with an eligibility subset keep their fixed size and are unaffected. Requires
        Manager/Admin role.

        402 when the change would grow a published process's census beyond what it paid for:
        40178 with the quote in data (its processId names the process to buy headroom for with
        POST /processes/{processId}/census/checkout); for a managed organization, 40175 when its
        integrator's wallet falls short (data: requiredCents, availableCents), or 40183 past the
        spend cap its integrator set (data: capCents, spentCents, requiredCents).
        422 when the grown census needs a custom quote.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Member IDs to add
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.AddCensusParticipantsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Members added; no on-chain resize needed
          schema:
            $ref: '#/definitions/apicommon.UpdateProcessCensusResponse'
        "202":
          description: Members added; maxCensusSize update enqueued
          schema:
            $ref: '#/definitions/apicommon.UpdateProcessCensusResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "402":
          description: Census growth beyond the price paid
          schema:
            allOf:
            - $ref: '#/definitions/errors.Error'
            - properties:
                data:
                  $ref: '#/definitions/apicommon.ProcessCensusGrowthQuote'
              type: object
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Process is not published
          schema:
            $ref: '#/definitions/errors.Error'
        "422":
          description: Census size requires a custom quote
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Add members to a published process's census
      tags:
      - processes
  /processes/{processId}/census/checkout:
    post:
      consumes:
      - application/json
      description: |-
        Debits the payer's wallet for the difference between what the process already paid
        and what its census would cost at censusSize, so a census that outgrew its price can
        be grown (or a paid draft republished) instead of being stuck behind a 402. Add-ons are
        priced exactly as the original payment priced them, so a once-per-organization add-on
        (branding, custom URL) is never charged twice. When the wallet covers it the paid
        amount is raised at once and the response carries no checkout session (amountCents is
        what was debited). When it does not: a managed organization gets 402 (40175); any other
        gets a wallet top-up checkout for the shortfall (at least €1), and the headroom is
        debited once that payment is verified by webhook — never before, so a published process's
        census stays refused until then; if the process changed meanwhile the credit stays in the
        wallet.
        There is no status of its own for that checkout: poll GET /processes/{processId}/checkout,
        whose amountCents reaches the new price once the headroom is debited, and the wallet
        history (GET /organizations/{orgAddress}/wallet), which shows the topup credit and then a
        payment row for the process. A topup with no payment row after it means the debit was
        refused: for a published process, retry the growth and, on its 402 (shortfallCents 0),
        call this endpoint again to debit the wallet; for a draft, publish it again: the publish
        debits the difference from the wallet.
        400 when the process has no completed payment, or when the target does not cost more
        than was already paid. Requires Admin role.
        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Census headroom to buy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.ProcessCensusCheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessCheckoutResponse'
        "400":
          description: No completed payment, or nothing left to buy
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "402":
          description: Integrator wallet does not cover the difference (40175), or
            spend cap reached (40183)
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Payment changed or being refunded (40177), or organization
            being deleted (40901)
          schema:
            $ref: '#/definitions/errors.Error'
        "422":
          description: Census size requires a custom quote
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302), retry after Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Buy census headroom for a paid process
      tags:
      - processes
  /processes/{processId}/check:
    post:
      consumes:
      - application/json
      description: |-
        Report the voter's status for a voting process: census membership, weight, and per
        question eligibility and vote status. The voter is identified solely by the auth token
        (the only voter data the client stores); the token must be verified and issued for this
        process. Ineligibility is reported as belongsToProcess=false with HTTP 200, not an error.
        Per question, hasSigned reports that the CSP signed the voter's ballot (the vote may not be
        on chain), and hasVoted that the vote is on chain. In an anonymous (blind) census hasVoted
        is always false, since the CSP never learns the voting address: hasSigned is the only
        signal. When the chain cannot be asked about a signed question the call fails with 500
        rather than report the vote as missing.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Request with auth token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CheckMembershipRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProcessCheckResponse'
        "400":
          description: Malformed body or missing auth token
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Auth token not verified or not issued for this process
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process or census not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error or blockchain request failed
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Check a voter's status for a voting process
      tags:
      - processes
  /processes/{processId}/checkout:
    delete:
      description: |-
        Expires the draft's open top-up checkout so it can no longer be paid, drops its pending
        payment and releases the add-on claims the checkout took. It is how a draft whose
        checkout is open is published from the wallet instead (publish refuses it with 409
        while the session is payable). A checkout already completed is not expired: its money
        lands in the wallet regardless. 404 (40179) when there is no payment; 409 (40177) when
        the payment is paid, refunded or failed, or when the checkout's top-up was already spent
        on the process's publish (its ledger shows it paid): publish it again instead, which
        charges nothing. Requires Admin role.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found (40038), or no payment or checkout for it
            (40179)
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Paid, refunded or failed, top-up spent on its publish, checkout
            changed, or draft busy
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Stripe could not verify or expire the session
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Cancel the open top-up checkout of a voting process
      tags:
      - processes
    get:
      description: |-
        The payment state (pending while a top-up checkout is open, paid, failed, refunded)
        combined with the live Stripe state of the top-up checkout opened for the process, if
        any. What a process paid is its payer's wallet ledger (GET
        /organizations/{orgAddress}/wallet); status here is refreshed from it by every payment path
        and can lag it briefly after a failure, while the amountCents of a paid process is read off
        it (its wallet payments plus what it paid outside the wallet). This endpoint is for polling
        the outcome, it never fulfills. consumed is true while a top-up credited to the wallet waits for the
        publish the webhook then runs. refusal is set when it could not (price rose,
        wallet short, the draft cannot publish, the requester is no longer an admin...): the
        credit stays in the wallet and the process is published by hand. consumed with no
        refusal and status still pending means the webhook will retry the publish: the credit
        is already in the wallet, so POST /processes/{processId}/publish may be called at once
        instead of waiting, and the retry then finds the process published. status paid means
        the process is published or its publish job is running; jobId names the latest publish
        job (the webhook's included): poll GET /jobs/{jobId}. status failed means the publish
        failed after the payment and was credited back; that job's errors say why, and a failed
        payment may carry no jobId when the failure came before the job existed (the publish
        response said why). status paid with a failed job means the publish failed but the
        payment was kept: either some of its elections were mined (the draft can then only be
        published again, which resumes the rest; it cannot be edited or deleted, 40904; the job's
        errors and the questions' upstreamId in GET /processes/{processId} show it) or its add-ons
        are in use by another process. Either way publish again: it charges nothing. The one
        exception is a job failed as interrupted by a service restart (its error says so): the
        dead worker's publish claim is reclaimed only once it is PublishStaleAfter (15 minutes,
        from its last renewal) old, so until then publish answers 409 (40903). After that,
        whichever comes first wins: the stale sweep credits the debit back, status turns failed
        and publishing again charges again; or a publish takes the claim first, charges nothing
        and resumes the publish.
        404 with 40179 means the draft exists but has no payment: none was opened, or a top-up
        checkout that expired or whose delayed payment failed was dropped (open a new one); 404
        with 40038 means the process itself is gone.
        Requires Manager/Admin of the organization.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessPaymentStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found (40038), or no payment or checkout for it
            (40179)
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Get the payment status of a voting process
      tags:
      - processes
    post:
      consumes:
      - application/json
      description: |-
        Opens a one-time Stripe checkout that tops up the organization's wallet by what it
        lacks to pay the draft's server-calculated price (the shortfall, at least the €1
        minimum; VAT added by Stripe Tax at checkout), and returns its client secret. Once the
        payment is verified by webhook the wallet is credited and the process is published as
        the requesting user, paid from the wallet; if it cannot be (its price rose, it changed
        or was deleted) the credit stays in the wallet and the process is published by hand.
        An open session for the same price and shortfall is reused; an obsolete one is
        expired and replaced. A draft publish would refuse is refused here first, with the same
        error, before any money is taken. 400 when the process is free, the wallet already
        covers it (publish directly; an open checkout of the draft is expired and dropped
        first), or it is not ready to publish. 403 (40181) for a managed
        organization: its integrator's wallet pays at publish. 409 (40177) when the draft is
        already paid (buy census headroom instead), a delete refunded it and did not finish
        (delete it again), its last checkout completed and is being credited, or another
        draft's payment holds a once-per-organization add-on it selects.
        422 (40176) above 50 000 voters (quote-only). Requires Admin role.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Checkout parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.ProcessCheckoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessCheckoutResponse'
        "400":
          description: Free process, wallet covers the price, empty census, or not
            ready to publish
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "403":
          description: Managed organization (no wallet), or an integrator's own organization
            (40174)
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Paid, checkout completing, add-on held by another draft, questions
            out of sync, or busy
          schema:
            $ref: '#/definitions/errors.Error'
        "422":
          description: Census size requires a custom quote
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Top up the wallet to publish a voting process
      tags:
      - processes
  /processes/{processId}/endDate:
    put:
      consumes:
      - application/json
      description: |-
        Moves the end date of every open (READY or PAUSED) published question's election to `endDate`
        (RFC 3339, any offset; stored in UTC, truncated to seconds), as an async job; closed questions
        keep their outcome and are skipped. Admin only (JWT, or an API key with `voting:write` whose
        user is Admin); free. Extend only: the new end must be at least 5 minutes after the current end
        (the current end itself is accepted as a no-op job) and at most 90 days after the process's start date. Request
        the extension at least 5 minutes plus 1 minute per open question before the current end; the one
        exception is a repair: an endDate that an open question's election already ends at on chain (left
        by a partially failed job) is accepted even after the current end, and finishes the rest:
        questions already ended on chain are skipped, and if one is still open but too close to its end
        the job fails with nothing sent until it has ended.
        Poll GET /jobs/{jobId}: `result.status` is the requested end date (applied
        only if the job completed) and `result.questions[]` gives each open question's
        `status`/`error`/`noOp`. The stored end date (used by voter
        authentication) changes only when every question succeeded; on a partial failure the job
        fails with "n of m questions failed; send the same endDate again to finish the rest" and calling
        again with the same endDate finishes the rest
        (done questions are no-ops). A question found closed on chain is skipped (`noOp`, with the reason
        in `error`) and its stored status corrected. If the stored end date changed after the request was
        validated, the job fails before sending anything and names the current end date. The job can also
        fail before sending anything ("...; nothing was changed"), including "no open question left to
        extend" when every question is closed on chain.
        A 500 is an internal error or a failed blockchain check of a repair; no job was created, so retrying is safe.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: New end date
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.SetProcessEndDateRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Bad endDate, over 90 days, unpublished, ended or near its end,
            no open question
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: User is not admin of the organization
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal error or blockchain check failed; no job was created,
            retry
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Organization transaction in progress (50303), or tx queue full
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Extend the end date of a published process
      tags:
      - processes
  /processes/{processId}/participants:
    get:
      description: |-
        Manager/Admin lookup of organization members by a single field (email, phone,
        memberNumber, nationalId), intersected with the process census, reporting each
        matched member's per-question vote status: hasSigned when the CSP signed the member's
        ballot (the vote may not be on chain), hasVoted only when the vote is on chain. In an
        anonymous (blind) census hasVoted is always false and hasSigned is the only signal. When
        the chain cannot be asked about a signed question, that question is reported with
        hasVotedUnknown=true (and hasVoted=false) instead of failing the whole list. For `phone`
        pass the plaintext number; it is hashed server-side. Requires Manager/Admin of the
        owning organization.

        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: 'Lookup field: email, phone, memberNumber or nationalId'
        in: query
        name: field
        required: true
        type: string
      - description: Value to match for the given field
        in: query
        name: value
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessParticipantsResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Server busy hashing the phone, retry after Retry-After (50302)
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: List voted participants of a voting process
      tags:
      - processes
  /processes/{processId}/participants/{participantId}:
    get:
      description: |-
        Public participant info for a published voting process. PLACEHOLDER: validates the
        process (published only) and the participant id, and currently returns null —
        participant election info is not yet surfaced (pending the CSP indexer lookup).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Participant ID
        in: path
        name: participantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Placeholder: null until participant info is surfaced'
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Get a voting process participant
      tags:
      - processes
  /processes/{processId}/price:
    get:
      description: |-
        Server-side price of the draft in EUR cents, VAT excluded: base price from the
        census size plus the selected add-ons, with the current payment status. Branding
        and custom URL are once per organization: not priced once the organization paid
        them. While another draft's payment holds one the draft selects, it stays priced in,
        addOnsHeldBy names that draft, and publish and checkout answer 409 (40177) until its
        payment completes (the add-on is then free) or is cancelled. Above 15 000 voters a custom
        quote is recommended; above 50 000 the process is quote-only: no price (empty
        lines, totalCents 0, quoteRequired true), and publish and checkout answer 422
        (40176). Requires Manager/Admin of the organization.

        Also callable with a scoped API key (scope: `voting:write`).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.ProcessPriceResponse'
        "400":
          description: Census is empty or invalid
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Get the price of a voting process
      tags:
      - processes
  /processes/{processId}/publish:
    post:
      consumes:
      - application/json
      description: |-
        Publish a voting process: one on-chain election per question, submitted as a batch.
        Requires Admin role (or a `voting:write` key). Returns 202 with a job id; poll
        GET /jobs/{jobId}. Idempotent once published.
        Transient failures (the chain not answering or confirming, a full tx queue) are retried
        by the service up to 5 times, with about 2.5 minutes of backoff between attempts; the job
        stays pending meanwhile. Each attempt runs up to 3 rounds, each waiting up to 40 s per
        question for its election to be mined, so on a stalled chain the job can stay pending for
        6 attempts × 3 rounds × 40 s × questions + 2.5 minutes: about 15 minutes for one question,
        over 3 hours for 15. Poll GET /jobs/{jobId} until it is completed or failed.
        If the publish finally fails before any election is mined, a failed publish credits the
        payer's wallet back (a `creditBack` history row) and publishing again charges again.
        A publish that failed after submitting its elections is credited back only once the chain
        proves none of them can be mined; until then the draft stays paid, and publishing again
        adopts any election that did mine instead of creating a second one, at no new charge.
        409 (40172) means the stored questions do not match the process and the draft has to be
        saved again before it can be published.
        400 (40004) "process is not ready to publish: ..." lists every problem found, including
        "anonymous voting is temporarily unavailable" for an anonymous process while the service has
        anonymous voting off. A process some of whose questions are already on chain still resumes.
        409 (40177) while a top-up checkout opened for the draft is still open: pay it, or, when
        the draft's price changed since, call POST /processes/{processId}/checkout again to
        replace it (or cancel it with DELETE /processes/{processId}/checkout) and publish again.
        A priced process is paid from its payer's wallet (the organization's own, or its
        integrator's when managed) at publish. 402 (40178) means the organization's wallet does
        not cover it: the error data carries the quote, balanceCents and shortfallCents; top it
        up via POST /processes/{processId}/checkout, which publishes once paid. A draft that already
        paid part of its price (its census grew since) gets the data's paidCents and censusSize
        too, and buys the difference with POST /processes/{processId}/census/checkout. For a managed
        organization, 402 (40175) means its integrator's wallet does not cover the price (data:
        requiredCents, availableCents), and 402 (40183) that the price would take it past the
        spend cap its integrator set (data: capCents, spentCents, requiredCents).
        409 (40177) also answers while another draft is paying for a once-per-organization add-on
        (branding, custom URL) this one selects, and while it selects one its payment does not
        include that the organization has not paid for either: deselect it, or publish once
        another process pays for it.
        422 (40176) means the census is above 50 000 voters: quote-only, no self-service price.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Already published
          schema:
            $ref: '#/definitions/apicommon.CreateVotingProcessResponse'
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Not ready to publish (lists every problem)
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "402":
          description: Wallet short or spend cap reached
          schema:
            allOf:
            - $ref: '#/definitions/errors.Error'
            - properties:
                data:
                  $ref: '#/definitions/apicommon.ProcessPaymentRequired'
              type: object
        "403":
          description: An integrator's own organization cannot own processes (40174)
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Publish in progress, out of sync, checkout open, add-on held,
            org being deleted (40901)
          schema:
            $ref: '#/definitions/errors.Error'
        "422":
          description: Census size requires a custom quote
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Busy (50302 wallet or census growth, 50303 org tx), retry after
            Retry-After
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Publish a voting process
      tags:
      - processes
  /processes/{processId}/questions/{questionId}:
    get:
      description: |-
        Public voter read of a single question, including its synced status and live results.
        Auth is optional: only a Manager/Admin of the org (or a voting:write API key) receives
        the question's eligibleMemberIds and, for an open-value question, the free-text voter
        memos inside its results.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.PublicQuestionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Get a voting process question
      tags:
      - processes
  /processes/{processId}/questions/{questionId}/census:
    put:
      consumes:
      - application/json
      description: |-
        Replace the set of members eligible to vote one question of a voting process, for a
        draft or a published process (closes #611). Requires Manager/Admin role.

        The body is the **complete desired list, not a delta**, so the request is idempotent:
        resend the whole list to change it. Every id must already be a participant of the
        process census. Input order is preserved and duplicates are dropped, so a client can
        diff what it reads back against its next request.

        **An empty list does not mean "nobody": it is the encoding for "no restriction" and
        opens the question to every member of the census.** A response of `eligible: 0`
        therefore means the question is open to everyone.

        Because reopening a restricted question can multiply its electorate while its election
        was sized on chain for the old subset, a maxCensusSize increase is enqueued as an async
        job whenever the question needs more room than it was published with (202; poll GET
        /jobs/{jobId}).

        Removing a member the CSP has already signed for, while a question of this process is
        still READY or PAUSED, is refused with 409 and the offending ids in
        `data.signedMemberIds`.

        Also callable with a scoped API key (scope: `voting:write`).

        402 when the change would grow a published process's census beyond what it paid for:
        40178 with the quote in data (its processId names the process to buy headroom for with
        POST /processes/{processId}/census/checkout); for a managed organization, 40175 when its
        integrator's wallet falls short (data: requiredCents, availableCents), or 40183 past the
        spend cap its integrator set (data: capCents, spentCents, requiredCents).
        422 when the grown census needs a custom quote.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: string
      - description: Complete desired eligibility list
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.UpdateQuestionCensusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Eligibility updated; no on-chain resize needed
          schema:
            $ref: '#/definitions/apicommon.UpdateQuestionCensusResponse'
        "202":
          description: Eligibility updated; maxCensusSize update enqueued
          schema:
            $ref: '#/definitions/apicommon.UpdateQuestionCensusResponse'
        "400":
          description: Invalid input data, or a member is not part of the census
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errors.Error'
        "402":
          description: Census growth beyond the price paid
          schema:
            allOf:
            - $ref: '#/definitions/errors.Error'
            - properties:
                data:
                  $ref: '#/definitions/apicommon.ProcessCensusGrowthQuote'
              type: object
        "404":
          description: Process or question not found
          schema:
            $ref: '#/definitions/errors.Error'
        "409":
          description: Publish in progress, member already signed for, or list changed
          schema:
            $ref: '#/definitions/errors.Error'
        "422":
          description: Census size requires a custom quote
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Set a question's eligibility list
      tags:
      - processes
  /processes/{processId}/questions/{questionId}/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Question ID
        in: path
        name: questionId
        required: true
        type: string
      - description: Target status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.SetProcessStatusRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Invalid status, or a question in a terminal status cannot change
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Organization transaction in progress (50303), or tx queue full
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Change status of one question
      tags:
      - processes
  /processes/{processId}/questions/status:
    put:
      consumes:
      - application/json
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Target status + questions
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.SetQuestionsStatusRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Invalid status, or a question in a terminal status cannot change
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Organization transaction in progress (50303), or tx queue full
          schema:
            $ref: '#/definitions/errors.Error'
      security:
      - BearerAuth: []
      summary: Change status of many questions
      tags:
      - processes
  /processes/{processId}/results:
    get:
      description: |-
        Public per-question on-chain results of a published voting process: one entry per
        published question, each with its tally (vote count, max voters, whether final, and
        the per-choice results). Auth is optional: a Manager/Admin of the org (or a voting:write
        API key) additionally receives each open-value question's free-text voter memos.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apicommon.VotingProcessResultsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Get a voting process results
      tags:
      - processes
  /processes/{processId}/sign:
    post:
      consumes:
      - application/json
      description: |-
        Sign a voter's ballot for one question's on-chain election. Requires a verified token
        bound to the process; authorizes the member against the question's eligibility subset
        and consumes the per-election signing slot (a question cannot be signed twice).
        Body: authToken, electionId (the question's on-chain election id) and payload (the voter
        address). tokenR is unused.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Sign request (see description for fields)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized, unverified token, election not in process, or
            member not eligible
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process, census, or user not found
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Sign a ballot for a voting process question
      tags:
      - processes
  /processes/{processId}/sign-batch:
    post:
      consumes:
      - application/json
      description: |-
        Batch form of POST /processes/{processId}/sign. A multi-question voting process is
        one on-chain election per question, so a voter holds one ballot per question and
        signing them one by one costs a round trip each. This signs them all under a single
        verified auth token. Public endpoint: the token authenticates the voter.
        Each ballot names a question by its on-chain election id (upstreamId, as returned by
        the check and sign-info endpoints) and the voter address to sign for it.
        The batch is authorized as a unit and signs nothing on failure — every ballot must
        name an election of this process (else 401) the member is eligible for (else 401),
        carry a 20-byte voter address (else 400), and no election may be repeated (else
        400). Authorization strictly precedes the first signature, so a rejected batch
        consumes nothing.
        Once authorized, every ballot is signed and the response is always 200 with one
        entry per request item, in order — even if every ballot fails (the request was
        honored; the outcome is per item). Each entry carries a signature and weight, or a
        stable machine-readable code plus a message: already_consumed (that election's
        signing slot is spent; not retryable), already_signing (a concurrent request holds
        it; retry), auth_invalid (the token was invalidated mid-batch and every remaining
        entry is stamped with it; authenticate again), address_mismatch (that election was
        already signed for a different address; re-send with the address sign-info
        reports) or sign_failed (internal failure; retry). Retry ONLY the entries that
        carry a retryable code: re-sending the whole batch re-signs the ballots that
        already succeeded, and every signature, re-signs included, counts toward the election's
        limit (MaxCSPSignaturesPerElection, 10 in total) — past it the election is permanently
        locked for the voter.
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Auth token and one ballot per question
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.SignBatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SignBatchResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "401":
          description: Unauthorized, unverified token, election not in process, or
            member not eligible
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Census or user not found
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Sign every question's ballot of a voting process in one call
      tags:
      - processes
  /processes/{processId}/sign-info:
    post:
      consumes:
      - application/json
      description: |-
        Per-question consumed address, nullifier and timestamp for the voter identified
        by a verified CSP auth token. Only questions the voter has already voted are
        returned. This is the /processes replacement of the single-election sign-info.
        Public endpoint (the token authenticates the voter).
      parameters:
      - description: Process ID
        in: path
        name: processId
        required: true
        type: string
      - description: Auth token
        in: body
        name: request
        required: true
        schema:
