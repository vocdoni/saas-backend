        description: CensusSize is the census size to buy room for; it must exceed
          what is already paid.
        type: integer
      locale:
        type: string
      returnURL:
        description: ReturnURL is where Stripe redirects after checkout; the session
          id is appended.
        type: string
    type: object
  apicommon.ProcessCensusGrowthQuote:
    properties:
      balanceCents:
        description: BalanceCents is the payer's wallet balance, ShortfallCents what
          DueCents exceeds it by.
        type: integer
      censusSize:
        description: CensusSize is the projected size the quote was computed for.
        type: integer
      currency:
        type: string
      dueCents:
        type: integer
      lines:
        items:
          $ref: '#/definitions/pricing.QuoteLine'
        type: array
      paidCents:
        description: PaidCents is the envelope already bought, DueCents the difference
          to TotalCents.
        type: integer
      processId:
        description: |-
          ProcessID is the process whose envelope is exceeded. A memberbase change can reach the
          census of several processes, so it names the one to buy headroom for.
        type: string
      shortfallCents:
        type: integer
      totalCents:
        type: integer
    type: object
  apicommon.ProcessCheckoutRequest:
    properties:
      locale:
        type: string
      returnURL:
        description: ReturnURL is where Stripe redirects after checkout; the session
          id is appended.
        type: string
    type: object
  apicommon.ProcessCheckoutResponse:
    properties:
      amountCents:
        type: integer
      clientSecret:
        type: string
      currency:
        type: string
      sessionId:
        type: string
    type: object
