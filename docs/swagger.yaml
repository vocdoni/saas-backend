  /vote:
    post:
      consumes:
      - application/json
      description: |-
        Relays a voter transaction that has already been signed by the voter to the
        Vochain. The body carries a marshaled models.SignedTx whose inner Tx is a Vote
        envelope; the target process is taken from that envelope, so no process id is
        passed in the path. Public endpoint: no authentication is required. The request is
        checked synchronously — the body must decode to a Vote envelope (else 400) for a
        process the backend knows (else 404) — then enqueued for submission on a background
        worker; the call returns 202 with a job id. The chain's acceptance or rejection of
        the vote (proof, nullifier, election state) is decided when the worker submits it and
        reported on the job: poll GET /jobs/{jobId} for the voteID on success, or a failure.
      parameters:
      - description: Signed vote transaction payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.RelayVoteRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted; poll GET /jobs/{jobId}
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Transaction queue is full
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Relay an already-signed vote to the Vochain
      tags:
      - vote
  /votes:
    post:
      consumes:
      - application/json
      description: |-
        Relays several voter transactions, already signed by the voter, in one call. A
        multi-question voting process is one vochain process per question, so a voter casts
        one vote transaction per question; relaying them one by one leaves a window in which
        some are on chain and the rest are not, and the voter ends up half-voted. This
        endpoint closes that window. Public endpoint: no authentication is required.
        The whole batch is checked synchronously and is accepted or rejected as a unit —
        every payload must decode to a Vote envelope (else 400) for a process the backend
        knows (else 404), all of them must belong to the same organization (else 400), and
        the queue must have room for all of them (else 503). A rejected batch enqueues
        nothing. At most 100 votes per call.
        The call returns 202 with a single job id covering the batch. Poll
        GET /jobs/{jobId}: its result carries one entry per vote, index-aligned with the
        request, each with the process id and the nullifier — both known before submission,
        so they are readable while the job is pending — plus the chain-assigned voteID once
        that vote is accepted, or the reason it failed.
      parameters:
      - description: Signed vote transaction payloads
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.RelayVotesRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted; poll GET /jobs/{jobId}
          schema:
            $ref: '#/definitions/apicommon.EnqueuedResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "404":
          description: Process not found
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/errors.Error'
        "503":
          description: Transaction queue is full
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Relay a batch of already-signed votes to the Vochain
      tags:
      - vote
  /votes/verify:
    post:
      consumes:
      - application/json
      description: |-
        Checks whether the Vochain has a vote for each of the given nullifiers, so a voter
        can confirm that the ballots relayed on their behalf are registered on chain. Public
        endpoint: no authentication is required, and it exposes only data that is already
        public on chain. Several nullifiers are accepted in one call because a multi-question
        voting process is one on-chain election per question, so a voter holds one nullifier
        per question. The response has one entry per requested nullifier, in the same order;
        a repeated nullifier is looked up only once and every copy gets the same answer.
        An unknown nullifier is reported as verified=false rather than as an error, while a
        chain that cannot be reached fails the whole call so a voter is never told their vote
        is missing when it merely could not be looked up.
      parameters:
      - description: Vote nullifiers to verify
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apicommon.VerifyVotesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Verification outcome per nullifier
          schema:
            $ref: '#/definitions/apicommon.VerifyVotesResponse'
        "400":
          description: Invalid input data
          schema:
            $ref: '#/definitions/errors.Error'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/errors.Error'
        "500":
          description: Blockchain request failed
          schema:
            $ref: '#/definitions/errors.Error'
      summary: Verify vote nullifiers against the Vochain
      tags:
      - vote
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: |-
      Type "Bearer" followed by a space and either a JWT (user session) or a
      scoped API key (prefixed "vsk_"). API keys are accepted only on endpoints
      that opt into key auth, and only when the key carries the required scope.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
