  expires: "Läuft ab in {{.ExpiryTime}}"
  enter: "Gib ihn auf der Abstimmungsseite ein, um fortzufahren."
  ignore: "Falls du diesen Code nicht erwartet hast, kannst du diese Nachricht ignorieren: niemand kann ohne ihn in deinem Namen abstimmen."
  footer_why: "Du erhältst diese Nachricht, weil {{.Organization}} diese Adresse verwendet, um deine Identität vor der Abstimmung zu bestätigen."
  footer_secured: "Abstimmung gesichert durch Vocdoni"
  # also the SMS: one line, at most 64 characters rendered with a 6-digit code and "15 Minuten"
