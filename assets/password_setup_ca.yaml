subject: "Estableix una contrasenya per al teu compte de Vocdoni"
body: |
  El teu codi per establir la contrasenya de Vocdoni és: {{.Code}}

  També pots utilitzar aquest enllaç per establir la teva contrasenya: {{.Link}}

  Has demanat afegir una contrasenya al teu compte de Vocdoni, on ara inicies sessió amb un proveïdor extern. Si no has estat tu, ignora aquest correu.
