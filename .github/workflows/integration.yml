name: Integration

# Runs the test suite against a vocdoni-node ref pinned by a `/integration` PR comment or the
# dispatch input; the rules are in README.md, "Testing against an unmerged vocdoni-node".
# Unpinned runs would repeat main.yml, so on pull_request the tests run only with a sticky ref.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      vocdoni_node_ref:
        description: 'vocdoni-node commit SHA, branch, tag or PR number (760 or #760) to test against (empty = the go.mod version)'
        type: string
        required: false
        default: ''
  issue_comment:
    types: [created]

jobs:
  resolve:
    name: Resolve refs
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    # Runs for a dispatch, a pull_request, or a `/integration` comment on a pull
    # request. An unrelated comment is skipped here, which skips the test job too.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/integration'))
    permissions:
      contents: read
      pull-requests: write
      issues: write # the 👀 reaction on the comment
    outputs:
      authorized: ${{ steps.refs.outputs.authorized }}
      parsed: ${{ steps.refs.outputs.parsed }}
      reset: ${{ steps.refs.outputs.reset }}
      sticky: ${{ steps.refs.outputs.sticky }}
      checkout_ref: ${{ steps.refs.outputs.checkout_ref }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
      vocdoni_node_ref: ${{ steps.refs.outputs.vocdoni_node_ref }}
      error: ${{ steps.refs.outputs.error }}
    steps:
      # Default ref: on issue_comment that is the default branch, so the parser
      # runs trusted code, never the commented PR's. On pull_request it is the PR's
      # merge commit, so the sticky script comes from that merge.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISPATCH_NODE: ${{ inputs.vocdoni_node_ref }}
        run: |
          set -euo pipefail
          # fail <message>: the reason goes to the Actions log and, as the resolve
          # error output, into the PR reply. One line, at most 1000 characters.
          fail() {
            echo "::error::$1" >&2
            # Characters, not bytes (C.UTF-8), so the cut never splits a multibyte character.
            local LC_ALL=C.UTF-8 msg="${1//$'\n'/ }"
            printf 'error=%s\n' "${msg:0:1000}" >> "$GITHUB_OUTPUT"
            exit 1
          }
          # fail_file <stderr file> <fallback>: the file's first line is the reason.
          fail_file() {
            cat "$1" >&2
            local reason
            reason="$(head -n 1 "$1" || true)"
            fail "${reason:-$2}"
          }
          if [ "$EVENT_NAME" = pull_request ]; then
            # Sticky pins from the PR's own comments. Refs are re-resolved here
            # on every push; checkout_ref stays empty (the default merge ref).
            if ! gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" | jq -s 'add // []' | scripts/integration-sticky.sh >> "$GITHUB_OUTPUT"; then
              fail "could not read the sticky refs of PR #$PR_NUMBER (see the run log)"
            fi
          elif [ "$EVENT_NAME" = issue_comment ]; then
            # A failed lookup fails this step (reported as an error). Only a
            # successful answer below admin/maintain/write is a rejection.
            if ! permission="$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .permission)"; then
              fail "could not look up the permission of $COMMENTER on $REPO (gh api failed, see the run log)"
            fi
            case "$permission" in
              admin | maintain | write) ;;
              *)
                fail "$COMMENTER has '$permission' on $REPO; /integration needs write access"
                ;;
            esac
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
            pins_out="$RUNNER_TEMP/pins.out"
            pins_err="$RUNNER_TEMP/pins.err"
            # Only the first line goes to the parser: a body over the pipe buffer would
            # SIGPIPE printf, and pipefail would turn a valid command into a rejection.
            if ! printf '%s\n' "${COMMENT_BODY%%$'\n'*}" | scripts/integration-pins.sh > "$pins_out" 2> "$pins_err"; then
              fail_file "$pins_err" "could not parse the /integration command"
            fi
            cat "$pins_out" >> "$GITHUB_OUTPUT"
            echo "parsed=true" >> "$GITHUB_OUTPUT"
            # `/integration reset` builds nothing: the report only says the sticky state is cleared.
            if grep -qx 'reset=true' "$pins_out"; then
              exit 0
            fi
            # Tests the same merge commit a pull_request run would, frozen when
            # this run starts; a push after that is not picked up.
            pr_json="$RUNNER_TEMP/pr.json"
            for _ in 1 2 3 4 5; do
              gh api "repos/$REPO/pulls/$PR" > "$pr_json"
              if [ "$(jq -r '.mergeable' "$pr_json")" != null ]; then
                break
              fi
              sleep 3
            done
            merge_sha="$(jq -r '.merge_commit_sha // empty' "$pr_json")"
            mergeable="$(jq -r '.mergeable' "$pr_json")"
            if [ -z "$merge_sha" ] || [ "$mergeable" != true ]; then
              fail "PR #$PR does not merge cleanly into its base (mergeable=$mergeable)"
            fi
            head_sha="$(jq -r '.head.sha' "$pr_json")"
            {
              echo "checkout_ref=$merge_sha"
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"
          else
            # Whitespace would let one input smuggle a second key into the line below.
            if [[ "$DISPATCH_NODE" =~ [[:space:]] ]]; then
              fail "ref inputs must not contain whitespace"
            fi
            line="/integration"
            if [ -n "$DISPATCH_NODE" ]; then
              line="$line vocdoni-node=$DISPATCH_NODE"
            fi
            pins_out="$RUNNER_TEMP/dispatch.out"
            pins_err="$RUNNER_TEMP/dispatch.err"
            if ! printf '%s\n' "$line" | scripts/integration-pins.sh > "$pins_out" 2> "$pins_err"; then
              fail_file "$pins_err" "could not parse the dispatch ref inputs"
            fi
            cat "$pins_out" >> "$GITHUB_OUTPUT"
            echo "parsed=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test suite
    needs: resolve
    # For a pull_request the job runs only when a sticky vocdoni-node ref is set:
    # the regular Main workflow already tests every PR against the go.mod version.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.reset != 'true' && (github.event_name != 'pull_request' || needs.resolve.outputs.vocdoni_node_ref != '') }}
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 45
    # Every comment and dispatch run gets its own group, so a pinned run is never
    # cancelled by a push or another comment. Queue order between groups is not
    # guaranteed, so "newest wins" could not be relied on.
    concurrency:
      group: integration-${{ (github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    outputs:
      vocdoni_node_sha: ${{ steps.pins.outputs.vocdoni_node_sha }}
      failure: ${{ steps.failure.outputs.failure }}
    env:
      # A pinned vocdoni-node may raise the go directive in go.mod, so the toolchain
      # must be allowed to download. Otherwise the go.mod version is used as is.
      GOTOOLCHAIN: auto
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Empty except for /integration comment runs (the PR's merge commit);
          # empty means the default event ref, as for a pull request or a dispatch.
          ref: ${{ needs.resolve.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No module cache on comment runs: they would save PR code's cache into the default
          # branch's scope. Hygiene only; the write-access gate in resolve is the defence.
          cache: ${{ runner.environment == 'github-hosted' && github.event_name != 'issue_comment' }}

      - name: Pin vocdoni-node
        id: pins
        if: needs.resolve.outputs.vocdoni_node_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/steps"; exec > >(tee -a "$RUNNER_TEMP/steps/pins.log") 2>&1
          set -euo pipefail
          # The output goes to a file, not $(...): errexit is suppressed inside a
          # command substitution, so a failed pin would go unnoticed.
          scripts/integration-pin-node.sh "$NODE_REF" "$RUNNER_TEMP/vocdoni-node" > "$RUNNER_TEMP/pin.out"
          sha="$(sed -n 's/^sha=//p' "$RUNNER_TEMP/pin.out")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no sha from pin of vocdoni-node" >&2; exit 1; }
          echo "vocdoni_node_sha=$sha" >> "$GITHUB_OUTPUT"
          # Shows in the log what the pin rewrote.
          git diff --stat go.mod go.sum

      - name: Summarize tested refs
        id: summary
        env:
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
          NODE_SHA: ${{ steps.pins.outputs.vocdoni_node_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/steps"; exec > >(tee -a "$RUNNER_TEMP/steps/summary.log") 2>&1
          set -euo pipefail
          dvote="$(go list -m -f '{{.Version}}' go.vocdoni.io/dvote)"
          {
            echo "### Tested refs"
            echo "- saas-backend: \`$(git rev-parse --short HEAD)\`"
            if [ -n "$NODE_REF" ]; then
              echo "- vocdoni-node: \`$NODE_REF\` → \`$NODE_SHA\`"
            else
              echo "- vocdoni-node: go.mod version (\`$dvote\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Go test
        id: gotest
        run: |
          mkdir -p "$RUNNER_TEMP/steps"; exec > >(tee -a "$RUNNER_TEMP/steps/gotest.log") 2>&1
          go test -failfast -timeout=30m ./...

      # Each step above keeps its own log under $RUNNER_TEMP/steps (the tee line at the top of
      # its run). The first failed step, in workflow order, gets its excerpt into the report.
      - name: Collect failure output
        id: failure
        if: failure()
        env:
          OUT_PINS: ${{ steps.pins.outcome }}
          OUT_SUMMARY: ${{ steps.summary.outcome }}
          OUT_GOTEST: ${{ steps.gotest.outcome }}
        run: |
          set -euo pipefail
          step=""
          log=""
          # pick <outcome> <step name> <step id>: the first failed step wins.
          pick() {
            if [ "$1" = failure ] && [ -z "$step" ]; then
              step="$2"
              log="$RUNNER_TEMP/steps/$3.log"
            fi
          }
          pick "$OUT_PINS" "Pin vocdoni-node" pins
          pick "$OUT_SUMMARY" "Summarize tested refs" summary
          pick "$OUT_GOTEST" "Run Go test" gotest
          if [ -n "$step" ]; then
            excerpt="$(scripts/integration-failure.sh "$step" "$log")"
          else
            # No step with a captured log failed: checkout or setup.
            excerpt="A setup step failed before any captured step; see the run log."
          fi
          # A random delimiter, so no line of the output can end the value early.
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "failure<<$delim"
            printf '%s\n' "$excerpt"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  report:
    name: Report to PR
    needs: [resolve, test]
    # Replies to an authorized /integration comment (an unparsed one gets "rejected"; others are
    # ignored) and to every push run whose tests passed or failed. A cancelled run was superseded.
    if: ${{ always() && ((github.event_name == 'issue_comment' && needs.resolve.outputs.authorized == 'true') || (github.event_name == 'pull_request' && (needs.test.result == 'success' || needs.test.result == 'failure'))) }}
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    permissions:
      contents: read # the checkout below
      pull-requests: write
    steps:
      # This job holds a write token, so it runs the base's scripts (the default branch for a
      # comment), never the PR's: a PR's own integration-report.sh takes effect once merged.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          persist-credentials: false

      - name: Post result to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.issue.number }}
          PARSED: ${{ needs.resolve.outputs.parsed }}
          RESOLVE: ${{ needs.resolve.result }}
          RESULT: ${{ needs.test.result }}
          RESET: ${{ needs.resolve.outputs.reset }}
          STICKY: ${{ needs.resolve.outputs.sticky }}
          CHECKOUT: ${{ github.event_name == 'pull_request' && github.sha || needs.resolve.outputs.checkout_ref }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || needs.resolve.outputs.head_sha }}
          NODE_REF: ${{ needs.resolve.outputs.vocdoni_node_ref }}
          NODE_SHA: ${{ needs.test.outputs.vocdoni_node_sha }}
          FAILURE: ${{ needs.test.outputs.failure }}
          ERROR: ${{ needs.resolve.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/report.md"
          if [ "$EVENT" = pull_request ] && [ ! -f scripts/integration-report.sh ]; then
            # The base checkout has no report script until this change reaches it.
            echo "::warning::scripts/integration-report.sh is not on the base branch yet, no report posted"
            exit 0
          fi
          scripts/integration-report.sh > "$body"
          if [ "$EVENT" = issue_comment ]; then
            gh pr comment "$PR" -R "$REPO" --body-file "$body"
          elif ! gh pr comment "$PR" -R "$REPO" --body-file "$body"; then
            # A fork PR's token is read-only: the run still counts, only the reply is lost.
            echo "::warning::could not post the integration report on #$PR (a fork PR's token is read-only)"
          fi
